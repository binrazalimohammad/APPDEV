hwi_oauth:
    firewall_names: [main]
    resource_owners:
        google:
            type: google
            client_id: '%env(GOOGLE_CLIENT_ID)%'
            client_secret: '%env(GOOGLE_CLIENT_SECRET)%'
            scope: 'email profile'
            options:
                # Redirect after Google — match route in config/routes/hwi_google.yaml
                redirect_route: auth_google_callback
