<!DOCTYPE html>
<!--
  DFD Level 1 — printable poster styled like coursework reference diagram.
  Open in Chrome → Print → Save as PDF (Landscape recommended).
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DFD Level 1 — DFD Field Report System (Mobile Web)</title>
  <style>
    :root {
      --ink: #1a1a1a;
      --accent: #0b4f6c;
      --muted: #4a5568;
      --line: #2d3748;
      --entity: #e8f4fc;
      --process: #fff8e6;
      --store: #f0fff4;
      --out: #f7f2ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: #fafafa;
    }
    header {
      padding: 1rem 1.5rem 0.5rem;
      text-align: center;
      border-bottom: 2px solid var(--accent);
      background: #fff;
    }
    header h1 {
      margin: 0 0 0.25rem;
      font-size: 1.35rem;
      color: var(--accent);
    }
    header p {
      margin: 0;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0.75rem;
    }
    svg {
      width: 100%;
      height: auto;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.06);
    }
    .note {
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.45;
    }
    @media print {
      body { background: #fff; }
      header { border-bottom-color: #000; }
      svg { box-shadow: none; border: none; }
      .note { font-size: 9pt; }
    }
  </style>
</head>
